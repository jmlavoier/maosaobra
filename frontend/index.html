<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mãos à Obra</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #FAF5F0 0%, #EDD9C4 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: #2E2C28;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #6A4F34;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
    }

    #topbar-brand {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    #topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #topbar-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
    }

    #avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    #btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.85);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }

    #btn-signout:hover { background: rgba(255,255,255,.22); }

    /* ── App container ───────────────────────────────────────────────────── */
    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    /* ── Loading / error ─────────────────────────────────────────────────── */
    .status-msg {
      text-align: center;
      padding: 64px 0;
      color: #706B64;
      font-size: 0.95rem;
    }

    .status-msg.error { color: #9a3412; }

    /* ── Dashboard ───────────────────────────────────────────────────────── */
    .dash-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #6A4F34;
      margin-bottom: 20px;
    }

    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      border-left: 4px solid #6A4F34;
      padding: 20px 22px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .project-card:hover {
      box-shadow: 0 6px 24px rgba(139,107,74,.15);
      transform: translateY(-1px);
    }

    .project-card-info h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #6A4F34;
      margin-bottom: 4px;
    }

    .project-card-info p {
      font-size: 0.82rem;
      color: #706B64;
      line-height: 1.5;
    }

    .project-card-arrow {
      color: #9B9690;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 56px 0;
      color: #9B9690;
    }

    .empty-state p { font-size: 0.95rem; }

    /* ── Project view ─────────────────────────────────────────────────────── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6A4F34;
      cursor: pointer;
      margin-bottom: 20px;
      user-select: none;
    }

    .back-link:hover { text-decoration: underline; }

    .header-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      border-left: 4px solid #6A4F34;
      padding: 28px 28px 24px;
      margin-bottom: 20px;
    }

    .header-card h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #6A4F34;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.82rem;
      color: #9B9690;
      margin-bottom: 24px;
    }

    .progress-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pct-label { font-size: 0.8rem; color: #706B64; margin-bottom: 4px; }

    .pct-value {
      font-size: 3rem;
      font-weight: 900;
      color: #6A4F34;
      line-height: 1;
    }

    .task-count { font-size: 0.82rem; color: #9B9690; text-align: right; }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #EDD9C4;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6A4F34, #B08060);
      transition: width .5s ease;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, #345A4E, #60A08B);
    }

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .budget-card {
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .budget-card .label { font-size: 0.72rem; color: #706B64; margin-bottom: 3px; }
    .budget-card .amount { font-size: 0.9rem; font-weight: 700; }

    .budget-card.total   { background: #EDD9C4; }
    .budget-card.total   .amount { color: #4A3320; }
    .budget-card.done    { background: #C4DDD3; }
    .budget-card.done    .amount { color: #203B34; }
    .budget-card.pending { background: #F0E8DF; }
    .budget-card.pending .amount { color: #6A4F34; }

    /* ── Phase cards ──────────────────────────────────────────────────────── */
    .phases { display: flex; flex-direction: column; gap: 14px; }

    .phase-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .phase-header {
      width: 100%;
      border: none;
      cursor: pointer;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      text-align: left;
    }

    .phase-header.pacote-a { background: linear-gradient(90deg, #6A4F34, #B08060); }
    .phase-header.pacote-b { background: linear-gradient(90deg, #345A4E, #60A08B); }
    .phase-header.extras   { background: linear-gradient(90deg, #9a3412, #7B6B8B); }

    .phase-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .phase-meta  { font-size: 0.75rem; opacity: .8; margin-top: 2px; }

    .phase-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mini-track {
      width: 80px;
      height: 7px;
      background: rgba(255,255,255,.25);
      border-radius: 9999px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      background: #fff;
      border-radius: 9999px;
      transition: width .4s ease;
    }

    .phase-pct { font-size: 0.82rem; font-weight: 600; min-width: 36px; text-align: right; }
    .chevron   { flex-shrink: 0; }

    /* ── Item list ────────────────────────────────────────────────────────── */
    .item-list { list-style: none; }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 20px;
      cursor: pointer;
      background: #fff;
      border-bottom: 1px solid #F0E8DF;
      transition: background .15s;
      user-select: none;
    }

    .item:last-child  { border-bottom: none; }
    .item.done-item   { background: #C4DDD3; }
    .item:active      { background: #FAF5F0; }
    .item-icon        { flex-shrink: 0; margin-top: 2px; }

    .item-text {
      font-size: 0.92rem;
      line-height: 1.5;
      transition: color .15s;
    }

    .item.done-item .item-text {
      color: #9B9690;
      text-decoration: line-through;
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #9B9690;
      margin-top: 28px;
    }

    @media (max-width: 480px) {
      .header-card h1 { font-size: 1.35rem; }
      .pct-value { font-size: 2.4rem; }
      .budget-grid { gap: 6px; }
      .budget-card .amount { font-size: 0.78rem; }
      #topbar-name { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top bar (hidden until auth confirmed) -->
  <div id="topbar" style="display:none">
    <div id="topbar-brand">Mãos à Obra</div>
    <div id="topbar-right">
      <div id="avatar"></div>
      <span id="topbar-name"></span>
      <button id="btn-signout">Sair</button>
    </div>
  </div>

  <div id="app">
    <p class="status-msg">A carregar…</p>
  </div>

  <script>
    'use strict';

    /* ── SVG icons ────────────────────────────────────────────────────────── */
    const ICON_CHECK = `
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#60A08B"/>
        <path d="M7 12.5l3.5 3.5 6.5-7" stroke="white" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const ICON_CIRCLE = `
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10.5" stroke="#C4B8A8" stroke-width="1.5"/>
      </svg>`;

    const ICON_UP = `
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2">
        <path d="M18 15l-6-6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const ICON_DOWN = `
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2">
        <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const ICON_ARROW_RIGHT = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const ICON_ARROW_LEFT = `
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    /* ── Helpers ─────────────────────────────────────────────────────────── */
    const fmt = (v) =>
      'R$\u00a0' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escAttr(str) { return escHtml(str).replace(/'/g, '&#x27;'); }

    const CATEGORY_CLASS = {
      'Pacote A — Mão de Obra Geral':       'pacote-a',
      'Pacote B — Banheiros (Acabamentos)': 'pacote-b',
      'Extras — Serviços Adicionais':       'extras',
    };

    /* ── Auth ────────────────────────────────────────────────────────────── */
    function getToken() { return localStorage.getItem('mao_token'); }
    function getUser()  {
      try { return JSON.parse(localStorage.getItem('mao_user')); } catch { return null; }
    }

    function signOut() {
      localStorage.removeItem('mao_token');
      localStorage.removeItem('mao_user');
      window.location.replace('/signin');
    }

    async function apiFetch(url, options = {}) {
      const token = getToken();
      const res = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        signOut();
        return null;
      }
      return res;
    }

    /* ── Router ──────────────────────────────────────────────────────────── */
    function navigate(path) {
      window.history.pushState({}, '', path);
      route();
    }

    function route() {
      const path = window.location.pathname;
      const projectMatch = path.match(/^\/project\/(\d+)$/);
      if (projectMatch) {
        renderProject(parseInt(projectMatch[1], 10));
      } else if (path === '/dashboard' || path === '/') {
        renderDashboard();
      } else {
        navigate('/dashboard');
      }
    }

    window.addEventListener('popstate', route);

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    function initTopBar(user) {
      const initial = user.name ? user.name.charAt(0).toUpperCase() : '?';
      document.getElementById('avatar').textContent = initial;
      document.getElementById('topbar-name').textContent = user.name;
      document.getElementById('topbar').style.display = 'flex';
      document.getElementById('topbar-brand').addEventListener('click', () => navigate('/dashboard'));
      document.getElementById('btn-signout').addEventListener('click', signOut);
    }

    /* ── Dashboard view ──────────────────────────────────────────────────── */
    async function renderDashboard() {
      document.title = 'Dashboard — Mãos à Obra';
      const app = document.getElementById('app');
      app.innerHTML = '<p class="status-msg">A carregar projetos…</p>';

      const res = await apiFetch('/api/projects');
      if (!res) return;

      if (!res.ok) {
        app.innerHTML = '<p class="status-msg error">Erro ao carregar projetos.</p>';
        return;
      }

      const projects = await res.json();

      if (projects.length === 0) {
        app.innerHTML = `
          <p class="dash-title">Meus Projetos</p>
          <div class="empty-state"><p>Nenhum projeto encontrado.</p></div>`;
        return;
      }

      const cardsHtml = projects.map(p => `
        <div class="project-card" data-id="${p.id}">
          <div class="project-card-info">
            <h2>${escHtml(p.name)}</h2>
            <p>${escHtml(p.address || '')}${p.address && p.worker_name ? ' &nbsp;·&nbsp; ' : ''}${escHtml(p.worker_name || '')}</p>
          </div>
          <span class="project-card-arrow">${ICON_ARROW_RIGHT}</span>
        </div>`).join('');

      app.innerHTML = `
        <p class="dash-title">Meus Projetos</p>
        <div class="project-grid">${cardsHtml}</div>`;

      app.querySelectorAll('.project-card').forEach(card => {
        card.addEventListener('click', () => {
          navigate(`/project/${card.dataset.id}`);
        });
      });
    }

    /* ── Project view ────────────────────────────────────────────────────── */
    let projectState  = null;  // current project object
    let groupsState   = [];    // [{category, total_value, items}]
    let collapsed     = {};    // { category: bool }

    async function renderProject(id) {
      document.title = 'Projeto — Mãos à Obra';
      const app = document.getElementById('app');
      app.innerHTML = '<p class="status-msg">A carregar…</p>';

      const [projRes, svcRes] = await Promise.all([
        apiFetch(`/api/projects/${id}`),
        apiFetch(`/api/projects/${id}/services`),
      ]);

      if (!projRes || !svcRes) return; // 401 handled — redirect in flight

      if (!projRes.ok || !svcRes.ok) {
        app.innerHTML = '<p class="status-msg error">Projeto não encontrado.</p>';
        return;
      }

      projectState = await projRes.json();
      groupsState  = await svcRes.json();
      groupsState.forEach(g => { collapsed[g.category] = false; });

      document.title = `${projectState.name} — Mãos à Obra`;
      paintProject();
    }

    function computeTotals() {
      let totalItems = 0, doneItems = 0, totalValue = 0, doneValue = 0;
      for (const g of groupsState) {
        for (const item of g.items) {
          totalItems++;
          totalValue += item.value;
          if (item.done) { doneItems++; doneValue += item.value; }
        }
      }
      return { totalItems, doneItems, totalValue, doneValue };
    }

    function paintProject() {
      const app = document.getElementById('app');
      const { totalItems, doneItems, totalValue, doneValue } = computeTotals();
      const pct = totalItems ? Math.round(doneItems / totalItems * 100) : 0;

      const headerHtml = `
        <span class="back-link" id="back-btn">${ICON_ARROW_LEFT} Projetos</span>
        <div class="header-card">
          <h1>${escHtml(projectState.name)}</h1>
          <p class="header-subtitle">${escHtml(projectState.address || '')}${projectState.address && projectState.worker_name ? ' &nbsp;|&nbsp; ' : ''}${escHtml(projectState.worker_name || '')}</p>

          <div class="progress-row">
            <div>
              <p class="pct-label">Progresso Geral</p>
              <span class="pct-value">${pct}%</span>
            </div>
            <p class="task-count">${doneItems} de ${totalItems} tarefas</p>
          </div>

          <div class="progress-track">
            <div class="progress-fill ${pct === 100 ? 'complete' : ''}" style="width:${pct}%"></div>
          </div>

          <div class="budget-grid">
            <div class="budget-card total">
              <p class="label">Orçamento Total</p>
              <p class="amount">${fmt(totalValue)}</p>
            </div>
            <div class="budget-card done">
              <p class="label">Valor Concluído</p>
              <p class="amount">${fmt(doneValue)}</p>
            </div>
            <div class="budget-card pending">
              <p class="label">Valor Pendente</p>
              <p class="amount">${fmt(totalValue - doneValue)}</p>
            </div>
          </div>
        </div>`;

      const phasesHtml = groupsState.map(g => {
        const gDone  = g.items.filter(i => i.done).length;
        const gTotal = g.items.length;
        const gPct   = gTotal ? Math.round(gDone / gTotal * 100) : 0;
        const cls    = CATEGORY_CLASS[g.category] || 'extras';
        const open   = !collapsed[g.category];

        const itemsHtml = open ? `
          <ul class="item-list">
            ${g.items.map(item => `
              <li class="item ${item.done ? 'done-item' : ''}"
                  data-id="${item.id}" data-done="${item.done}">
                <span class="item-icon">${item.done ? ICON_CHECK : ICON_CIRCLE}</span>
                <span class="item-text">${escHtml(item.description)}</span>
              </li>`).join('')}
          </ul>` : '';

        return `
          <div class="phase-card">
            <button class="phase-header ${cls}" data-cat="${escAttr(g.category)}">
              <div>
                <div class="phase-title">${escHtml(g.category)}</div>
                <div class="phase-meta">${fmt(g.total_value)} &nbsp;·&nbsp; ${gDone}/${gTotal} concluído</div>
              </div>
              <div class="phase-right">
                <div class="mini-track">
                  <div class="mini-fill" style="width:${gPct}%"></div>
                </div>
                <span class="phase-pct">${gPct}%</span>
                <span class="chevron">${open ? ICON_UP : ICON_DOWN}</span>
              </div>
            </button>
            ${itemsHtml}
          </div>`;
      }).join('');

      app.innerHTML = `
        ${headerHtml}
        <div class="phases">${phasesHtml}</div>
        <p class="footer">Controle de Obra — maosaobra</p>`;

      // Back button
      document.getElementById('back-btn').addEventListener('click', () => navigate('/dashboard'));

      // Phase toggles
      app.querySelectorAll('.phase-header').forEach(btn => {
        btn.addEventListener('click', () => {
          collapsed[btn.dataset.cat] = !collapsed[btn.dataset.cat];
          paintProject();
        });
      });

      // Item toggles
      app.querySelectorAll('.item').forEach(li => {
        li.addEventListener('click', () => {
          const id   = parseInt(li.dataset.id, 10);
          const done = li.dataset.done === 'true';
          toggleService(id, done).catch(err => {
            console.error(err);
            alert('Erro ao actualizar o serviço. Tente novamente.');
          });
        });
      });
    }

    async function toggleService(id, currentDone) {
      const res = await apiFetch(`/api/services/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ done: !currentDone }),
      });
      if (!res) return;
      if (!res.ok) throw new Error('Falha ao actualizar serviço');
      const updated = await res.json();

      for (const g of groupsState) {
        const item = g.items.find(i => i.id === updated.id);
        if (item) { item.done = updated.done; break; }
      }

      paintProject();
    }

    /* ── Boot ────────────────────────────────────────────────────────────── */
    (function boot() {
      const token = getToken();
      const user  = getUser();

      if (!token || !user) {
        window.location.replace('/signin');
        return;
      }

      initTopBar(user);

      // Redirect bare root to /dashboard
      if (window.location.pathname === '/') {
        window.history.replaceState({}, '', '/dashboard');
      }

      route();
    })();
  </script>
</body>
</html>
