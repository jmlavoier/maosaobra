<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mãos à Obra</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #FAF5F0 0%, #EDD9C4 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: #2E2C28;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #6A4F34;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
    }

    #topbar-brand {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    #topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #topbar-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
    }

    #avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    #btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.85);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }

    #btn-signout:hover { background: rgba(255,255,255,.22); }

    /* ── App container ───────────────────────────────────────────────────── */
    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    /* ── Loading / error ─────────────────────────────────────────────────── */
    .status-msg {
      text-align: center;
      padding: 64px 0;
      color: #706B64;
      font-size: 0.95rem;
    }

    .status-msg.error { color: #9a3412; }

    /* ── Dashboard ───────────────────────────────────────────────────────── */
    .dash-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #6A4F34;
      margin-bottom: 20px;
    }

    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      border-left: 4px solid #6A4F34;
      padding: 20px 22px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .project-card:hover {
      box-shadow: 0 6px 24px rgba(139,107,74,.15);
      transform: translateY(-1px);
    }

    .project-card-info h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #6A4F34;
      margin-bottom: 4px;
    }

    .project-card-info p {
      font-size: 0.82rem;
      color: #706B64;
      line-height: 1.5;
    }

    .project-card-arrow {
      color: #9B9690;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 56px 0;
      color: #9B9690;
    }

    .empty-state p { font-size: 0.95rem; }

    /* ── Project view ─────────────────────────────────────────────────────── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6A4F34;
      cursor: pointer;
      margin-bottom: 20px;
      user-select: none;
    }

    .back-link:hover { text-decoration: underline; }

    .header-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      border-left: 4px solid #6A4F34;
      padding: 28px 28px 24px;
      margin-bottom: 20px;
    }

    .header-card h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #6A4F34;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.82rem;
      color: #9B9690;
      margin-bottom: 24px;
    }

    .progress-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pct-label { font-size: 0.8rem; color: #706B64; margin-bottom: 4px; }

    .pct-value {
      font-size: 3rem;
      font-weight: 900;
      color: #6A4F34;
      line-height: 1;
    }

    .task-count { font-size: 0.82rem; color: #9B9690; text-align: right; }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #EDD9C4;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6A4F34, #B08060);
      transition: width .5s ease;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, #345A4E, #60A08B);
    }

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .budget-card {
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .budget-card .label { font-size: 0.72rem; color: #706B64; margin-bottom: 3px; }
    .budget-card .amount { font-size: 0.9rem; font-weight: 700; }

    .budget-card.total   { background: #EDD9C4; }
    .budget-card.total   .amount { color: #4A3320; }
    .budget-card.done    { background: #C4DDD3; }
    .budget-card.done    .amount { color: #203B34; }
    .budget-card.pending { background: #F0E8DF; }
    .budget-card.pending .amount { color: #6A4F34; }

    /* ── Phase cards ──────────────────────────────────────────────────────── */
    .phases { display: flex; flex-direction: column; gap: 14px; }

    .phase-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .phase-header {
      width: 100%;
      border: none;
      cursor: pointer;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      text-align: left;
    }

    .phase-header.pacote-a { background: linear-gradient(90deg, #6A4F34, #B08060); }
    .phase-header.pacote-b { background: linear-gradient(90deg, #345A4E, #60A08B); }
    .phase-header.extras   { background: linear-gradient(90deg, #9a3412, #7B6B8B); }

    .phase-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .phase-meta  { font-size: 0.75rem; opacity: .8; margin-top: 2px; }

    .phase-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mini-track {
      width: 80px;
      height: 7px;
      background: rgba(255,255,255,.25);
      border-radius: 9999px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      background: #fff;
      border-radius: 9999px;
      transition: width .4s ease;
    }

    .phase-pct { font-size: 0.82rem; font-weight: 600; min-width: 36px; text-align: right; }
    .chevron   { flex-shrink: 0; }

    /* ── Item list ────────────────────────────────────────────────────────── */
    .item-list { list-style: none; }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 20px;
      cursor: pointer;
      background: #fff;
      border-bottom: 1px solid #F0E8DF;
      transition: background .15s;
      user-select: none;
    }

    .item:last-child  { border-bottom: none; }
    .item.done-item   { background: #C4DDD3; }
    .item:active      { background: #FAF5F0; }
    .item-icon        { flex-shrink: 0; margin-top: 2px; }

    .item-text {
      font-size: 0.92rem;
      line-height: 1.5;
      transition: color .15s;
    }

    .item.done-item .item-text {
      color: #9B9690;
      text-decoration: line-through;
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #9B9690;
      margin-top: 28px;
    }

    @media (max-width: 480px) {
      .header-card h1 { font-size: 1.35rem; }
      .pct-value { font-size: 2.4rem; }
      .budget-grid { gap: 6px; }
      .budget-card .amount { font-size: 0.78rem; }
      #topbar-name { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top bar (hidden until auth confirmed) -->
  <div id="topbar" style="display:none">
    <div id="topbar-brand">Mãos à Obra</div>
    <div id="topbar-right">
      <div id="avatar"></div>
      <span id="topbar-name"></span>
      <button id="btn-signout">Sair</button>
    </div>
  </div>

  <div id="app">
    <p class="status-msg">A carregar…</p>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
