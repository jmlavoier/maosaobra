services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /data/maosaobra.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required in production}
    volumes:
      - sqlite_data:/data
    expose:
      - "3000"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
